<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <title>To Do List</title>
</head>

<body>
    <div class="row px-2">
        <div class="d-flex">
            <main class="col mx-auto mt-3 text-center">
                <div class="feedback alert">Write value for item name</div>
                <!-- form to para sa input ng items -->
                <form id="itemForm" class="my-3">
                    <h3 class="text-capitalize mb-4">to do list</h3>
                    <div class="input-group">
                        <input type="text" id="itemInput" class="form-control text-capitalize border-success-subtle"
                            placeholder="name of task..." />
                        <button type="submit" id="add-item"
                            class="btn btn-outline-success fw-semibold shadow-sm ms-2">Add item</button>
                    </div>
                </form>
                <!-- tapos ng form sa input ng items (line 36-47)-->
                <div class="item-container">
                    <div class="item-list my-5">
                        <!-- <div class="item my-3 d-flex justify-content-between align-items-center
                border-bottom border-success-subtle">
                            <div class="d-flex gap-1">
                                <h6 class="item-index border border-success-subtle rounded p-1">
                                    1&{index}
                                </h6>
                                <p class="item-name text-capitalize">${item}</p>
                            </div>
                            <a href="#"><i class="fas fa-check-circle complete-item mx-2 item-icon text-success"></i></a>
                            <a href="#"><i class="fas fa-edit edit-item mx-2 item-icon text-secondary"></i></a>
                            <a href="#"><i class="fas fa-times delete-item mx-2 item-icon text-danger"></i></a>
                        </div> -->
                    </div>
                    <button type="button" id="clear-list" class="btn btn-outline-success my-3 fw-semibold shadow-sm">Clear list</button>
                </div>
            </main>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
